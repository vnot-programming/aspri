name: AspriAI Remote Deployment CI/CD

on:
  push:
    branches:
      - main

jobs:
  # ------------------------------------------------------------------
  # JOB 1: Deploy Backend (AspriAI Core) ke GPU Cluster Node
  # ------------------------------------------------------------------
  deploy-core:
    name: Deploy Backend to GPU Node
    runs-on: ubuntu-latest
    if: github.repository == 'vnot-programming/aspri'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Cloudflared
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Setup SSH Config for GPU Node
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          
          cat <<EOF > ~/.ssh/config
          Host slurm.penelitian.my.id
            HostName slurm.penelitian.my.id
            User g6717500336
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking no
            ProxyCommand cloudflared access ssh --hostname %h --id ${{ secrets.CF_CLIENT_ID }} --secret ${{ secrets.CF_CLIENT_SECRET }}
          EOF

      - name: Execute Remote Deploy via SSH
        run: |
          ssh slurm.penelitian.my.id << 'EOF'
            echo "🚀 Menghubungkan ke GPU Node via Cloudflare Tunnel..."
            cd /data/users/g6717500336/singularity/AspriAI
            git pull origin main
            echo "✅ Backend AspriAI Core berhasil dideploy!"
          EOF

  # ------------------------------------------------------------------
  # JOB 2: Deploy Frontend (AspriAI Desk) ke Docker Host
  # ------------------------------------------------------------------
  deploy-desk:
    name: Deploy Frontend to Web Host
    runs-on: ubuntu-latest
    if: github.repository == 'vnot-programming/aspri'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Cloudflared
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Setup SSH Config for Web Host
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          
          cat <<EOF > ~/.ssh/config
          Host ssh-docker-host.vnot.my.id
            HostName ssh-docker-host.vnot.my.id
            User my
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking no
            ProxyCommand cloudflared access ssh --hostname %h --id ${{ secrets.CF_CLIENT_ID }} --secret ${{ secrets.CF_CLIENT_SECRET }}
          EOF

      - name: Execute Remote Deploy via SSH
        run: |
          ssh ssh-docker-host.vnot.my.id << 'EOF'
            echo "🚀 Menghubungkan ke Web Host via Cloudflare Tunnel..."
            cd /home/my/aspri-desk || cd /data/users/g6717500336/singularity/AspriAI
            git pull origin main
            echo "✅ Frontend AspriAI Desk berhasil dideploy!"
          EOF
